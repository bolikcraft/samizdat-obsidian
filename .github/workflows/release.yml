name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # BRAT and the catalog read the version from the manifest, not from the tag.
      - name: Check the tag against the manifest
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json has $manifest, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json
